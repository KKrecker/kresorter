name: CI

on:
  # Every push, a step's branch too (decision 0015, item 20).
  push:
  pull_request:

env:
  # Pinned here, used by the Windows build (decision 0015, item 19).
  INNO_SETUP_VERSION: "6.7.1"

jobs:
  check:
    # Linux and Windows for every Python, the repository being public (decision 0015, item 20;
    # pre-step-5 audit, B11).
    runs-on: ${{ matrix.os }}
    env:
      # The window's tests need no display, on either system (decision 0014, item 10).
      QT_QPA_PLATFORM: offscreen
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Qt's system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Mypy (strict)
        run: mypy
      - name: Tests + coverage 100 % (lines and branches)
        run: pytest

  build:
    # The sdist, then the wheel from it, once, after the checks; items 8 to 10 checked on them
    # and the wheel run (decision 0015, items 21 and 22). The Windows build takes this wheel.
    needs: check
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Qt's system libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: The sdist, then the wheel from it
        run: python -m build --no-isolation --outdir dist .
      - name: Items 8 to 10, on what was built
        env:
          KRESORTER_DIST: dist
        run: pytest --no-cov -p no:cacheprovider tests/test_artifacts.py tests/test_installed.py
      - name: The wheel, run
        run: python packaging/trial.py wheel dist
      - name: The wheel and the sdist, kept
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/
          if-no-files-found: error

  windows:
    # From that wheel, the folder, the portable zip and the installer (decision 0015, items 12
    # to 15 and 21), with the Python 3.13 of item 12; then each is run (item 22).
    needs: build
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: The wheel and the sdist
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist
      - name: The wheel with the extra ui and PyInstaller, in an environment of their own
        run: |
          python -m venv build-env
          build-env\Scripts\python -m pip install "$((Get-ChildItem dist\kresorter-*.whl).FullName)[ui]" -r packaging\windows\requirements.txt
      - name: The folder and the portable zip
        run: build-env\Scripts\pyinstaller --noconfirm packaging\windows\kresorter.spec
      - name: Inno Setup, the version pinned above
        run: choco upgrade innosetup --version $env:INNO_SETUP_VERSION -y --no-progress --allow-downgrade
      - name: The installer
        run: |
          $version = build-env\Scripts\python -c "import kresorter; print(kresorter.__version__)"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" packaging\windows\kresorter.iss
      - name: The portable zip and the installer, kept
        uses: actions/upload-artifact@v4
        with:
          name: windows-dist
          path: |
            dist/Kresorter-*-portable.zip
            dist/Kresorter-*-setup.exe
          if-no-files-found: error
      - name: The wheel, run
        run: python packaging/trial.py wheel dist
      - name: The portable zip, run
        run: python packaging/trial.py portable dist
      - name: The installer, run and uninstalled
        run: python packaging/trial.py installer dist

  release:
    # A tag vX.Y.Z, and nothing else, publishes what both builds made: PyPI by trusted
    # publishing, with no token, then the GitHub release (decision 0015, item 23). The tag is
    # checked before anything is published.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, windows]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: The tag is __version__ and the changelog's latest, and the runs are recorded
        run: python packaging/release.py check "$GITHUB_REF_NAME"
      - name: The wheel and the sdist
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist
      - name: The portable zip and the installer
        uses: actions/download-artifact@v4
        with:
          name: windows-dist
          path: windows
      - name: Their sums, and the release's text
        run: |
          python packaging/release.py sums dist windows > SHA256SUMS.txt
          python packaging/release.py notes "$GITHUB_REF_NAME" > notes.md
      - name: PyPI, by trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
      - name: The GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* windows/* SHA256SUMS.txt --title "Kresorter ${GITHUB_REF_NAME#v}" --notes-file notes.md
