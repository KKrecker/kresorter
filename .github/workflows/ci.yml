name: CI

on:
  # Every push, a step's branch too (decision 0015, item 20).
  push:
  pull_request:

env:
  # Pinned here, used by the Windows build (decision 0015, item 19).
  INNO_SETUP_VERSION: "6.7.1"

jobs:
  check:
    # Linux for every Python; Windows for the oldest and the newest while the repository is
    # private, for every Python once it is public (decision 0015, item 20; pre-step-5 audit,
    # B11).
    runs-on: ${{ matrix.os }}
    env:
      # The window's tests need no display, on either system (decision 0014, item 10).
      QT_QPA_PLATFORM: offscreen
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        exclude:
          - os: windows-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Qt's system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Mypy (strict)
        run: mypy
      - name: Tests + coverage 100 % (lines and branches)
        run: pytest
