name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Pinned here, used by the Windows build (decision 0015, item 19).
  INNO_SETUP_VERSION: "6.7.1"

jobs:
  check:
    # Linux only until the repository is on GitHub; then Windows and macOS
    # (docs/reviews/pre-step5-audit.md, B11).
    runs-on: ubuntu-latest
    env:
      # The window's tests need no display (decision 0014, item 10).
      QT_QPA_PLATFORM: offscreen
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Qt's system libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Mypy (strict)
        run: mypy
      - name: Tests + coverage 100 % (lines and branches)
        run: pytest
