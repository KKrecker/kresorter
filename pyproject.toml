[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "kresorter"
dynamic = ["version"]
description = "Safe, local-first file cleanup analyzer: report first, quarantine, delete only after confirmation."
readme = "README.md"
requires-python = ">=3.11"
# The licence and the metadata (decision 0015, items 5 and 7): an SPDX expression and its files
# (PEP 639), no licence classifier; Windows and Linux, no macOS.
license = "MIT"
license-files = ["LICENSE", "src/kresorter/ui/icons/LICENSE"]
authors = [{ name = "KKrecker" }]
keywords = ["cleanup", "duplicates", "files", "organizer", "quarantine", "autostart"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Filesystems",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/KKrecker/kresorter"
Source = "https://github.com/KKrecker/kresorter"
Issues = "https://github.com/KKrecker/kresorter/issues"
Changelog = "https://github.com/KKrecker/kresorter/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# The desktop window (decision 0014); the core needs nothing.
ui = ["PySide6-Essentials>=6.8,<7"]
# One version of each tool, and the Qt CI tests (decision 0015, item 19); a tool changes in a
# commit of its own.
dev = [
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "mypy==2.4.1",
    "ruff==0.17.3",
    "PySide6-Essentials==6.12.0",
    "pytest-qt==4.5.0",
    "build==1.6.1",
    "hatchling==1.33.0",
]

[project.scripts]
kresorter = "kresorter.cli:main"

[project.gui-scripts]
kresorter-ui = "kresorter.ui.launch:main"

[tool.hatch.version]
# The version is written once, in the package (decision 0015, item 2).
path = "src/kresorter/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/kresorter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-ra --strict-markers --cov=kresorter --cov-branch --cov-report=term-missing --cov-fail-under=100"
qt_api = "pyside6"
# A deprecation fails the tests when it is announced (pre-step-8 audit, A3).
filterwarnings = ["error"]

[tool.coverage.run]
source = ["kresorter"]
branch = true

[tool.coverage.report]
exclude_also = ["^\\s*\\.\\.\\.$", "if TYPE_CHECKING:"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
mypy_path = "src:tests"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "PT", "RUF", "TID", "ANN", "PTH"]

[tool.ruff.lint.isort]
# A red test imports a module before it exists: it is still ours.
known-first-party = ["kresorter"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN401"]
# The window's Russian texts: their Cyrillic letters are meant (decision 0014, item 28).
"src/kresorter/ui/labels.py" = ["RUF001"]
"src/kresorter/ui/texts.py" = ["RUF001"]

# Safety principle: deletion goes only through the quarantine API (see docs/decisions/0001).
# Applies to src AND tests. Path.unlink/rmdir are method calls ruff cannot ban;
# tests/test_no_direct_delete.py covers them with an AST check.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"os.remove".msg = "Direct deletion is forbidden. Use the quarantine API."
"os.unlink".msg = "Direct deletion is forbidden. Use the quarantine API."
"os.rmdir".msg = "Direct deletion is forbidden. Use the quarantine API."
"os.removedirs".msg = "Direct deletion is forbidden. Use the quarantine API."
"shutil.rmtree".msg = "Direct deletion is forbidden. Use the quarantine API."
