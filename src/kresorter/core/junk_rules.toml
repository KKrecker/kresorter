# Junk heuristics: data, not code. Interpreted by kresorter.core.heuristics.
#
# Fields:
#   id           unique, stable identifier (used in reports, journal and tests)
#   category     cache | browser_cache | temp | thumbnails | crash_dump | os_metadata
#   description  short human explanation of why this is junk
#   dirs         path patterns that must appear as consecutive parent directories;
#                segments are globs; a leading "/" anchors at the filesystem root
#   files        file-name globs
#   platforms    optional subset of windows | linux | darwin (default: all)
#
# A rule with both dirs and files matches only when both match.
# Order matters: the first matching rule wins, so specific rules come first.
# Every rule must have an example in tests/unit/test_heuristics.py (enforced by a test).
#
# Deliberately NOT junk: node_modules and build dirs (break projects), partial downloads
# (*.part, *.crdownload: resumable), Office lock files (~$*: live while a document is open),
# browser cookies/sessions and site data (Local Storage, IndexedDB, Service Worker: a web
# app's offline data), generic folders named "cache" or "tmp" inside user data.
#
# A browser's cache is a category of its own, for review (decision 0018, item 20): the
# browsers say it holds copies of pages, not sign-ins, but it costs every page loaded again.

[[rule]]
id = "python-bytecode"
category = "cache"
description = "Python bytecode cache; regenerated automatically on import."
dirs = ["__pycache__"]

[[rule]]
id = "tool-caches"
category = "cache"
description = "Developer tool cache (pytest, mypy, ruff); rebuilt on next run."
dirs = [".pytest_cache", ".mypy_cache", ".ruff_cache"]

[[rule]]
id = "chromium-cache"
category = "browser_cache"
description = "Chromium-based browser cache (Chrome, Edge, Brave); re-downloaded as needed."
dirs = ["User Data/*/Cache", "User Data/*/Code Cache", "User Data/*/GPUCache"]
platforms = ["windows"]

[[rule]]
id = "chromium-shader-caches"
category = "browser_cache"
description = "Chromium-based browser's shader caches (Chrome, Edge, Brave); rebuilt as pages are drawn."
dirs = [
    "User Data/ShaderCache",
    "User Data/GrShaderCache",
    "User Data/GraphiteDawnCache",
    "User Data/*/DawnCache",
    "User Data/*/DawnGraphiteCache",
    "User Data/*/DawnWebGPUCache",
]
platforms = ["windows"]

[[rule]]
id = "opera-cache"
category = "browser_cache"
description = "Opera browser cache (Opera, Opera GX); re-downloaded as needed."
dirs = ["Opera Software/*/Cache"]
platforms = ["windows"]

[[rule]]
id = "firefox-cache"
category = "browser_cache"
description = "Firefox disk cache; re-downloaded as needed."
dirs = ["Mozilla/Firefox/Profiles/*/cache2"]
platforms = ["windows"]

[[rule]]
id = "inet-cache"
category = "browser_cache"
description = "Windows internet cache (WinINet: Internet Explorer, Edge in IE mode)."
dirs = ["AppData/Local/Microsoft/Windows/INetCache"]
platforms = ["windows"]

[[rule]]
id = "browser-caches"
category = "browser_cache"
description = "Browser cache under ~/.cache (Chrome, Chromium, Firefox, Brave, Edge, Opera, Vivaldi, Yandex); re-downloaded as needed."
dirs = [
    ".cache/google-chrome",
    ".cache/chromium",
    ".cache/mozilla",
    ".cache/BraveSoftware",
    ".cache/microsoft-edge",
    ".cache/opera",
    ".cache/vivaldi",
    ".cache/yandex-browser",
]
platforms = ["linux"]

[[rule]]
id = "windows-thumbcache"
category = "thumbnails"
description = "Explorer thumbnail and icon cache; rebuilt automatically."
dirs = ["AppData/Local/Microsoft/Windows/Explorer"]
files = ["thumbcache_*.db", "iconcache_*.db"]
platforms = ["windows"]

[[rule]]
id = "thumbs-db"
category = "thumbnails"
description = "Legacy per-folder thumbnail database."
files = ["Thumbs.db", "ehthumbs.db"]

[[rule]]
id = "crash-dumps"
category = "crash_dump"
description = "Application crash dump; only useful for debugging a past crash."
dirs = ["AppData/Local/CrashDumps"]
platforms = ["windows"]

[[rule]]
id = "windows-error-reports"
category = "crash_dump"
description = "Windows Error Reporting's reports of crashes and hangs, sent or queued; only useful for debugging them."
dirs = [
    "AppData/Local/Microsoft/Windows/WER/ReportArchive",
    "AppData/Local/Microsoft/Windows/WER/ReportQueue",
]
platforms = ["windows"]

[[rule]]
id = "gpu-shader-caches"
category = "cache"
description = "Graphics drivers' shader caches (NVIDIA, AMD, Intel, DirectX); rebuilt by the driver, a game may stutter while it is."
dirs = [
    "AppData/Local/NVIDIA/DXCache",
    "AppData/Local/NVIDIA/GLCache",
    "AppData/LocalLow/NVIDIA/PerDriverVersion/DXCache",
    "AppData/LocalLow/NVIDIA/PerDriverVersion/GLCache",
    "AppData/Local/AMD/DxCache",
    "AppData/Local/AMD/DxcCache",
    "AppData/Local/AMD/GLCache",
    "AppData/Local/AMD/VkCache",
    "AppData/LocalLow/Intel/ShaderCache",
    "AppData/Local/D3DSCache",
]
platforms = ["windows"]

[[rule]]
id = "macos-library-caches"
category = "cache"
description = "macOS application caches; rebuilt by applications."
dirs = ["Library/Caches"]
platforms = ["darwin"]

[[rule]]
id = "xdg-thumbnails"
category = "thumbnails"
description = "Thumbnails of the freedesktop standard; made again from the originals."
dirs = [".cache/thumbnails"]
platforms = ["linux"]

[[rule]]
id = "user-cache-dir"
category = "cache"
description = "Per-user cache directory (XDG ~/.cache and tools using it)."
dirs = [".cache"]

[[rule]]
id = "windows-user-temp"
category = "temp"
description = "User temp directory. Scanned only on explicit choice (decision 0002)."
dirs = ["AppData/Local/Temp"]
platforms = ["windows"]

[[rule]]
id = "posix-temp"
category = "temp"
description = "System temp directory. Scanned only on explicit choice (decision 0002)."
dirs = ["/tmp", "/var/tmp"]
platforms = ["linux", "darwin"]

[[rule]]
id = "temp-files"
category = "temp"
description = "File with a temporary-file extension."
files = ["*.tmp", "*.temp"]

[[rule]]
id = "ds-store"
category = "os_metadata"
description = "macOS Finder folder metadata; recreated by Finder."
files = [".DS_Store"]
